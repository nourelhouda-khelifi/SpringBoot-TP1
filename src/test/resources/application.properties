# Configuration de test - application.properties pour le profil test

# Désactiver le serveur H2 TCP pour les tests (évite le conflit de port)
spring.h2.console.enabled=false

# Configuration de la base de données en mémoire
spring.datasource.url=jdbc:h2:mem:testdb

# Création du schéma à partir des entités
spring.jpa.hibernate.ddl-auto=create-drop

# Initialiser après la création du schéma
spring.jpa.defer-datasource-initialization=true

# Logs
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate.SQL=WARN
spring.jpa.show-sql=false
